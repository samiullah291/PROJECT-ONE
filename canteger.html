<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Form</title>
    <style>
/* RESET */
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: Arial;
}

/* BODY */
body {
    display: flex;
    flex-direction: column;
    min-height: 100vh;
}

/* FORM CONTAINER */
.form-container {
    flex: 1;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 20px;
}

/* FORM */
form {
    width: 100%;
    max-width: 350px;
    padding: 30px;
    border: 1px solid #ddd;
    border-radius: 10px;
    box-shadow: 0 5px 15px rgba(0,0,0,0.1);
}

form h2 {
    text-align: center;
    margin-bottom: 20px;
}

/* INPUT BOX */
.input-box {
    position: relative;
    margin-bottom: 20px;
}

.input-box i {
    position: absolute;
    left: 10px;
    top: 12px;
}

.input-box input {
    width: 100%;
    padding: 10px 10px 10px 35px;
    border: 1px solid #ccc;
    border-radius: 5px;
}

.input-box small {
    color: red;
    font-size: 12px;
}

/* BUTTON */
button {
    width: 100%;
    padding: 10px;
    border: none;
    background: black;
    color: white;
    border-radius: 5px;
    cursor: pointer;
}

/* FOOTER */
footer {
    background: black;
    color: white;
    padding: 30px 20px;
}

.footer-container {
    display: flex;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 20px;
}

.footer-box {
    flex: 1 1 200px;
}

.footer-box h3 {
    margin-bottom: 10px;
}

.footer-box a {
    display: block;
    color: white;
    text-decoration: none;
    margin: 5px 0;
}

.footer-box i {
    margin-right: 10px;
    cursor: pointer;
}

.copy {
    text-align: center;
    margin-top: 20px;
    font-size: 14px;
}

/* RESPONSIVE */
@media (max-width: 768px) {
    .footer-container {
        flex-direction: column;
        text-align: center;
    }
}
    </style>
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>
<body>

    <!-- FORM -->
    <div class="form-container">
        <form id="loginForm">
            <h2>Login</h2>

            <!-- Email -->
            <div class="input-box">
                <i class="fa fa-envelope"></i>
                <input type="text" id="email" placeholder="Enter Email">
                <small id="emailError"></small>
            </div>

            <!-- Password -->
            <div class="input-box">
                <i class="fa fa-lock"></i>
                <input type="password" id="password" placeholder="Enter Password">
                <small id="passwordError"></small>
            </div>

            <button type="submit">Login</button>
        </form>
    </div>

    <!-- FOOTER -->
    <footer>
        <div class="footer-container">

            <div class="footer-box">
                <h3>About</h3>
                <p>This is a simple responsive login page with validation.</p>
            </div>

            <div class="footer-box">
                <h3>Links</h3>
                <a href="#">Home</a>
                <a href="#">Shop</a>
                <a href="#">Contact</a>
            </div>

            <div class="footer-box">
                <h3>Follow</h3>
                <i class="fab fa-facebook"></i>
                <i class="fab fa-instagram"></i>
                <i class="fab fa-twitter"></i>
            </div>

        </div>

        <p class="copy">© 2026 All Rights Reserved</p>
    </footer>

    <script>
      document.getElementById("loginForm").addEventListener("submit", function(e) {
    e.preventDefault();

    let email = document.getElementById("email").value;
    let password = document.getElementById("password").value;

    let emailError = document.getElementById("emailError");
    let passwordError = document.getElementById("passwordError");

    let valid = true;

    // Email validation
    if (email === "") {
        emailError.innerText = "Email is required";
        valid = false;
    } else if (!email.includes("@")) {
        emailError.innerText = "Enter valid email";
        valid = false;
    } else {
        emailError.innerText = "";
    }

    // Password validation
    if (password === "") {
        passwordError.innerText = "Password is required";
        valid = false;
    } else if (password.length < 6) {
        passwordError.innerText = "Minimum 6 characters";
        valid = false;
    } else {
        passwordError.innerText = "";
    }

    // Success
    if (valid) {
        alert("Login Successful ✅");
    }
});
    </script>
</body>
</html>
